[package]
name = "foa-sta-replay-host-tests"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["rsn"]
rsn = []

[dependencies]
ieee80211 = { version = "=0.5.9", features = ["crypto"] }
portable-atomic = "=1.15.0"
log = "=0.4.33"
llc-rs = "=0.1.3"

[build-dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
